---
- name: Deploy & Configure CloudWatch Agent via SSM (Linux & Windows)
  hosts: all
  gather_facts: true
  strategy: free
  vars:
    cw_namespace: "DiskMonitoring"

  tasks:
    - name: Install & Configure CloudWatch Agent on Linux
      ansible.builtin.shell: |
        set -e
        if command -v apt-get >/dev/null 2>&1; then
          wget -q https://s3.amazonaws.com/amazoncloudwatch-agent/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb -O /tmp/amazon-cloudwatch-agent.deb
          dpkg -i /tmp/amazon-cloudwatch-agent.deb
        elif command -v yum >/dev/null 2>&1; then
          yum install -y amazon-cloudwatch-agent
        fi

        cat <<'EOF' > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
        {
          "agent": {
            "metrics_collection_interval": 60,
            "run_as_user": "cwagent"
          },
          "metrics": {
            "namespace": "{{ cw_namespace }}",
            "append_dimensions": {
              "InstanceId": "${aws:InstanceId}"
            },
            "metrics_collected": {
              "disk": {
                "measurement": ["used_percent", "inodes_free"],
                "resources": ["*"],
                "ignore_file_system_types": ["sysfs", "devtmpfs", "tmpfs", "squashfs"]
              }
            }
          }
        }
        EOF

        /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
          -a fetch-config -m ec2 -s \
          -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json
      args:
        executable: /bin/bash
      when: ansible_facts['os_family'] != 'Windows'

    - name: Install & Configure CloudWatch Agent on Windows
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "C:\Temp" | Out-Null
          Invoke-WebRequest -Uri "https://s3.amazonaws.com/amazoncloudwatch-agent/windows/amd64/latest/amazon-cloudwatch-agent.msi" -OutFile "C:\Temp\amazon-cloudwatch-agent.msi"
          Start-Process msiexec.exe -ArgumentList "/i C:\Temp\amazon-cloudwatch-agent.msi /qn" -Wait

          $config = @{
            agent = @{ metrics_collection_interval = 60 }
            metrics = @{
              namespace = "{{ cw_namespace }}"
              append_dimensions = @{ InstanceId = '${aws:InstanceId}' }
              metrics_collected = @{
                LogicalDisk = @{
                  measurement = @("% Free Space")
                  resources = @("*")
                }
              }
            }
          } | ConvertTo-Json -Depth 10

          Set-Content -Path "C:\ProgramData\Amazon\AmazonCloudWatchAgent\amazon-cloudwatch-agent.json" -Value $config
          & "C:\Program Files\Amazon\AmazonCloudWatchAgent\amazon-cloudwatch-agent-ctl.ps1" `
            -a fetch-config -m ec2 -s `
            -c file:"C:\ProgramData\Amazon\AmazonCloudWatchAgent\amazon-cloudwatch-agent.json"
      when: ansible_facts['os_family'] == 'Windows'
