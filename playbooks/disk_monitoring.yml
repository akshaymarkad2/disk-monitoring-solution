---
- name: Deploy CloudWatch Agent via SSM (Linux & Windows)
  hosts: all
  gather_facts: false
  tasks:
    - name: Deploy CloudWatch Agent using SSM
      aws_ssm_send_command:
        instance_ids: "{{ ansible_host }}"
        document_name: AWS-RunShellScript
        parameters:
          commands:
            - |
              # Linux: Install CloudWatch Agent
              if [ -f /etc/os-release ]; then
                wget https://s3.amazonaws.com/amazoncloudwatch-agent/ubuntu/amd64/latest/amazon-cloudwatch-agent.deb
                sudo dpkg -i amazon-cloudwatch-agent.deb

                # Configure for Linux
                cat <<EOF > /opt/aws/amazon-cloudwatch-agent/bin/config.json
                {
                  "agent": {
                    "metrics_collection_interval": 60,
                    "run_as_user": "root"
                  },
                  "metrics": {
                    "append_dimensions": {
                      "InstanceId": "{{ ansible_host }}"
                    },
                    "metrics_collected": {
                      "disk": {
                        "measurement": ["used_percent"],
                        "resources": ["*"]
                      }
                    }
                  }
                }
                EOF

                sudo /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -c file:/opt/aws/amazon-cloudwatch-agent/bin/config.json -s
              fi

              # Windows: Install CloudWatch Agent
              if [ -f "C:\System32\WindowsPowerShell\v1.0\powershell.exe" ]; then
                Invoke-WebRequest -Uri "https://s3.amazonaws.com/amazoncloudwatch-agent/windows/amd64/latest/amazon-cloudwatch-agent.msi" -OutFile "C:\Temp\amazon-cloudwatch-agent.msi"
                Start-Process msiexec.exe -ArgumentList "/i C:\Temp\amazon-cloudwatch-agent.msi /qn" -Wait

                # Configure for Windows
                $config = @{
                  "agent" = @{
                    "metrics_collection_interval" = 60
                  },
                  "metrics" = @{
                    "append_dimensions" = @{
                      "InstanceId" = "{{ ansible_host }}"
                    },
                    "metrics_collected" = @{
                      "disk" = @{
                        "measurement" = ["used_percent"],
                        "resources" = ["*"]
                      }
                    }
                  }
                } | ConvertTo-Json -Depth 10

                Set-Content -Path "C:\ProgramData\Amazon\AmazonCloudWatchAgent\config.json" -Value $config
                Start-Service AmazonCloudWatchAgent
              fi
        document_version: "\$DEFAULT"
        timeout_seconds: 300
      register: ssm_result
      async: 60
      poll: 0
